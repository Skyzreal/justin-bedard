<header class="site-header">
  <a class="brand" routerLink="/" (click)="closeMenu()">
    <img src="Logo.png" alt="Justin Bédard — Courtier immobilier" class="brand__logo" />
  </a>

  <nav class="site-nav" aria-label="Navigation principale">
    <a routerLink="/a-propos" routerLinkActive="is-active">À propos de moi</a>
    <a routerLink="/proprietes" routerLinkActive="is-active">Mes Propriétés</a>
    <a routerLink="/vendre" routerLinkActive="is-active">Vendre</a>
    <a routerLink="/acheter" routerLinkActive="is-active">Acheter</a>
  </nav>

  <div class="header-actions">
    <a class="phone" href="tel:8193604943">819.360.4943</a>
    <a class="btn btn-primary" routerLink="/contact">Me joindre</a>
  </div>

  <button
    class="menu-toggle"
    [class.is-open]="menuOpen()"
    (click)="toggleMenu()"
    [attr.aria-expanded]="menuOpen()"
    aria-label="Menu"
  >
    <span></span>
    <span></span>
    <span></span>
  </button>
</header>

<div class="mobile-nav" [class.is-open]="menuOpen()" role="dialog" aria-label="Menu mobile">
  <nav>
    <a routerLink="/a-propos" routerLinkActive="is-active" (click)="closeMenu()">À propos de moi</a>
    <a routerLink="/proprietes" routerLinkActive="is-active" (click)="closeMenu()">Mes Propriétés</a>
    <a routerLink="/vendre" routerLinkActive="is-active" (click)="closeMenu()">Vendre</a>
    <a routerLink="/acheter" routerLinkActive="is-active" (click)="closeMenu()">Acheter</a>
    <a href="tel:8193604943" class="mobile-phone" (click)="closeMenu()">819.360.4943</a>
    <a routerLink="/contact" class="btn btn-primary" (click)="closeMenu()">Me joindre</a>
  </nav>
</div>

<div class="mobile-overlay" [class.is-open]="menuOpen()" (click)="closeMenu()" aria-hidden="true"></div>
